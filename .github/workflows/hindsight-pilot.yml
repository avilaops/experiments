name: Hindsight pilot

on:
  pull_request:
    paths: ["pilots/hindsight/**", "test/hindsight-pilot.test.mjs", ".github/workflows/hindsight-pilot.yml"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: hindsight-pilot-${{ github.ref }}
  cancel-in-progress: true

jobs:
  contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 1
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 24
      - name: MCP and HTTP contract, isolation and sensitive input rejection
        run: node --test test/hindsight-pilot.test.mjs

  storage:
    runs-on: ubuntu-24.04
    timeout-minutes: 1
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_PASSWORD: synthetic-ci-only-password
        ports: ["5432:5432"]
        options: --health-cmd pg_isready --health-interval 2s --health-timeout 1s --health-retries 10
    env:
      PGHOST: 127.0.0.1
      PGUSER: postgres
      PGPASSWORD: synthetic-ci-only-password
      PILOT_STORAGE_FIXTURE: "true"
      POSTGRES_CONTAINER_ID: ${{ job.services.postgres.id }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: pgvector persistence, backup, restore and rollback fixture
        run: bash pilots/hindsight/backup-restore.sh
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: hindsight-storage-${{ github.sha }}
          path: reports/hindsight/
          if-no-files-found: error
          retention-days: 14

  package:
    needs: [contract, storage]
    runs-on: ubuntu-24.04
    timeout-minutes: 1
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Resolve upstream image digests and build the adapter
        run: |
          set -euo pipefail
          mkdir -p release/hindsight
          task_node_ref=node:24-alpine
          task_pg_ref=pgvector/pgvector:pg16
          task_hs_ref=ghcr.io/vectorize-io/hindsight:0.4.9-slim
          task_node_digest=$(docker buildx imagetools inspect "$task_node_ref" --format '{{.Manifest.Digest}}')
          task_pg_digest=$(docker buildx imagetools inspect "$task_pg_ref" --format '{{.Manifest.Digest}}')
          task_hs_digest=$(docker buildx imagetools inspect "$task_hs_ref" --format '{{.Manifest.Digest}}')
          for task_digest in "$task_node_digest" "$task_pg_digest" "$task_hs_digest"; do
            [[ "$task_digest" =~ ^sha256:[a-f0-9]{64}$ ]]
          done
          docker build --build-arg "NODE_IMAGE=${task_node_ref}@${task_node_digest}" --label "org.opencontainers.image.revision=${GITHUB_SHA}" --tag "avila-hindsight-adapter:sha-${GITHUB_SHA}" pilots/hindsight
          printf '%s\n' '{"jsonrpc":"2.0","id":1,"method":"initialize","params":{"protocolVersion":"2025-03-26"}}' | docker run --rm -i --network none -e HINDSIGHT_URL=http://hindsight:8888 -e HINDSIGHT_API_KEY=synthetic-ci-only-credential -e HINDSIGHT_BANK=avl419-ci-a -e PILOT_ENABLED=true -e "PILOT_EXPIRES_AT=$(date -u -d '+1 hour' +%FT%TZ)" "avila-hindsight-adapter:sha-${GITHUB_SHA}" | grep -q 'protocolVersion'
          docker save "avila-hindsight-adapter:sha-${GITHUB_SHA}" | gzip -1 > release/hindsight/adapter.tar.gz
          printf 'POSTGRES_IMAGE=%s@%s\nHINDSIGHT_IMAGE=%s@%s\nADAPTER_IMAGE=avila-hindsight-adapter:sha-%s\n' "$task_pg_ref" "$task_pg_digest" "$task_hs_ref" "$task_hs_digest" "$GITHUB_SHA" > release/hindsight/images.env
          cp pilots/hindsight/compose.yaml pilots/hindsight/RUNBOOK.md release/hindsight/
          printf '%s\n' "$GITHUB_SHA" > release/hindsight/REVISION
          touch /tmp/pilot-runtime.env
          PILOT_DB_PASSWORD=synthetic-ci-password PILOT_API_KEY=synthetic-ci-only-credential HINDSIGHT_RUNTIME_ENV=/tmp/pilot-runtime.env HINDSIGHT_BANK=avl419-ci-a PILOT_EXPIRES_AT=2099-01-01T00:00:00Z docker compose --env-file release/hindsight/images.env -f pilots/hindsight/compose.yaml config --quiet
          cd release/hindsight
          sha256sum adapter.tar.gz images.env compose.yaml RUNBOOK.md REVISION > SHA256SUMS
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: hindsight-release-${{ github.sha }}
          path: release/hindsight/
          if-no-files-found: error
          retention-days: 14

  live:
    # Enabling this requires an approved provider/model, a provider-side spending
    # ceiling and an environment reviewer. It never targets a shared deployment.
    if: github.event_name == 'workflow_dispatch' && vars.HINDSIGHT_PILOT_LIVE == 'true'
    needs: [contract, storage, package]
    environment: hindsight-pilot-ci
    runs-on: ubuntu-24.04
    timeout-minutes: 1
    env:
      PILOT_LIVE_APPROVED: "true"
      PILOT_PROVIDER: ${{ vars.HINDSIGHT_PILOT_PROVIDER }}
      PILOT_MODEL: ${{ vars.HINDSIGHT_PILOT_MODEL }}
      PILOT_COST_LIMIT_USD: ${{ vars.HINDSIGHT_PILOT_COST_LIMIT_USD }}
      PILOT_API_KEY: ${{ secrets.HINDSIGHT_PILOT_API_KEY }}
      PILOT_DB_PASSWORD: ${{ secrets.HINDSIGHT_PILOT_DB_PASSWORD }}
      HINDSIGHT_RUNTIME_ENV: /tmp/hindsight-runtime.env
      HINDSIGHT_URL: http://127.0.0.1:18888
      PILOT_KEEP_FOR_RESTORE: "true"
      HINDSIGHT_BANK: avl419-ci-a
      PILOT_EXPIRES_AT: "2099-01-01T00:00:00Z"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/download-artifact@v4
        with:
          name: hindsight-release-${{ github.sha }}
          path: release/hindsight/
      - name: Validate approved configuration without printing secrets
        env:
          PILOT_RUNTIME_ENV: ${{ secrets.HINDSIGHT_PILOT_RUNTIME_ENV }}
        run: |
          set -euo pipefail
          test -n "$PILOT_PROVIDER" && test -n "$PILOT_MODEL" && test -n "$PILOT_COST_LIMIT_USD"
          test -n "$PILOT_API_KEY" && test -n "$PILOT_DB_PASSWORD" && test -n "$PILOT_RUNTIME_ENV"
          [[ "$PILOT_DB_PASSWORD" =~ ^[A-Za-z0-9_-]{24,}$ ]]
          umask 077
          printf '%s\n' "$PILOT_RUNTIME_ENV" > "$HINDSIGHT_RUNTIME_ENV"
          cd release/hindsight && sha256sum -c SHA256SUMS
      - name: Start a disposable private runtime and evaluate MCP
        run: |
          set -euo pipefail
          docker load -i release/hindsight/adapter.tar.gz
          printf 'services:\n  hindsight:\n    ports: ["127.0.0.1:18888:8888"]\n' > /tmp/hindsight-ci.yaml
          docker compose --env-file release/hindsight/images.env -f pilots/hindsight/compose.yaml -f /tmp/hindsight-ci.yaml up -d --wait --wait-timeout 15
          node pilots/hindsight/evaluate.mjs
          docker stats --no-stream --format '{{json .}}' > reports/hindsight/container-resources.jsonl
      - name: Restore actual Hindsight database and roll the API to the restored copy
        run: |
          set -euo pipefail
          task_compose=(docker compose --env-file release/hindsight/images.env -f pilots/hindsight/compose.yaml -f /tmp/hindsight-ci.yaml)
          "${task_compose[@]}" stop hindsight
          "${task_compose[@]}" exec -T postgres pg_dump -U hindsight_pilot -Fc hindsight_pilot > /tmp/hindsight.dump
          sha256sum /tmp/hindsight.dump > /tmp/hindsight.dump.sha256
          sha256sum -c /tmp/hindsight.dump.sha256
          "${task_compose[@]}" exec -T postgres createdb -U hindsight_pilot hindsight_restored
          "${task_compose[@]}" exec -T postgres pg_restore -U hindsight_pilot --no-owner --exit-on-error -d hindsight_restored < /tmp/hindsight.dump
          PILOT_DATABASE_NAME=hindsight_restored "${task_compose[@]}" up -d --wait --wait-timeout 10 hindsight
          PILOT_PHASE=restored node pilots/hindsight/evaluate.mjs
      - name: Destroy disposable volumes and secrets
        if: always()
        run: |
          if test -f /tmp/hindsight-ci.yaml; then
            docker compose --env-file release/hindsight/images.env -f pilots/hindsight/compose.yaml -f /tmp/hindsight-ci.yaml down --volumes
          fi
          rm -f /tmp/hindsight-runtime.env /tmp/hindsight.dump /tmp/hindsight.dump.sha256
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: hindsight-live-${{ github.sha }}
          path: reports/hindsight/
          if-no-files-found: error
          retention-days: 14
