name: Validate and package

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: validate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  architecture-postgres:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: experiments_test
          POSTGRES_PASSWORD: isolated-ci-test
          POSTGRES_DB: experiments_architecture_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U experiments_test -d experiments_architecture_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      ARCHITECTURE_TEST_DATABASE_URL: postgresql://experiments_test:isolated-ci-test@127.0.0.1:5432/experiments_architecture_test
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 24
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run build
      - run: node --test test/architecture.test.mjs

  public-home:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: dashboard/package-lock.json
      - run: npm ci --no-audit --no-fund
        working-directory: dashboard
      - run: npx playwright install --with-deps chromium
        working-directory: dashboard
      - run: node scripts/check-public-home.mjs
      - name: Validate Caddy routing
        run: |
          printf ':8080 {\n header {\n -Server\n }\n @mlops_nonpublic not path /\n header @mlops_nonpublic X-Robots-Tag "noindex, nofollow"\n' > /tmp/public-home-test.caddy
          cat deploy/public-home.caddy >> /tmp/public-home-test.caddy
          printf '\n}\n' >> /tmp/public-home-test.caddy
          docker run --rm -v /tmp/public-home-test.caddy:/etc/caddy/Caddyfile:ro caddy:2 caddy validate --config /etc/caddy/Caddyfile --adapter caddyfile
      - name: Check anonymous root and private route separation
        run: |
          docker run -d --name public-home-router -p 18080:8080 -v /tmp/public-home-test.caddy:/etc/caddy/Caddyfile:ro -v "$PWD/site:/srv/avila-mlops/current:ro" caddy:2
          trap 'docker rm -f public-home-router' EXIT
          curl --retry 10 --retry-all-errors --retry-delay 1 --max-time 10 --retry-max-time 30 --fail http://localhost:18080/ -o /tmp/mlops-home.html
          grep -q 'Avila Ops MLOps' /tmp/mlops-home.html
          curl -sI http://localhost:18080/ | grep -i 'X-Robots-Tag: index, follow'
          curl -sI http://localhost:18080/unknown | grep -i 'X-Robots-Tag: noindex, nofollow'
          test "$(curl -s -o /dev/null -w '%{http_code}' http://localhost:18080/experiments/)" = 502
          test "$(curl -s -o /dev/null -w '%{http_code}' http://localhost:18080/auth/login)" = 502
          test "$(curl -s -o /dev/null -w '%{http_code}' http://localhost:18080/unknown)" = 404
      - name: Package public site
        run: |
          mkdir -p public-home/site public-home/deploy public-home/scripts
          cp site/index.html public-home/site/
          cp deploy/public-home.caddy public-home/deploy/
          cp scripts/deploy-public-home.py public-home/scripts/
          cd public-home
          sha256sum site/index.html deploy/public-home.caddy scripts/deploy-public-home.py > SHA256SUMS
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: public-home-${{ github.sha }}
          path: public-home/
          retention-days: 14
          if-no-files-found: error
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: public-home-screenshots-${{ github.sha }}
          path: reports/public-home/
          retention-days: 14

  core:
    runs-on: ubuntu-24.04
    timeout-minutes: 1
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci --no-audit --no-fund
      - name: Create MLOps evaluation request
        run: node scripts/ci-mlops.mjs request
      - name: Run core test suite
        id: core-tests
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          npm test 2>&1 | tee reports/mlops-ci/test-output.log
      - name: Create MLOps evidence and result
        if: always()
        env:
          MLOPS_TEST_OUTCOME: ${{ steps.core-tests.outcome }}
        run: node scripts/ci-mlops.mjs result
      - name: Preserve MLOps evaluation
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: mlops-evaluation-${{ github.sha }}-${{ github.run_attempt }}
          path: reports/mlops-ci/
          retention-days: 14
          if-no-files-found: error
      - name: Enforce core test result
        if: steps.core-tests.outcome != 'success'
        run: exit 1
      - name: Exercise real node:test evidence capture
        run: node examples/node-test-flow.mjs
      - name: Preserve node:test evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: node-test-evidence-${{ github.sha }}-${{ github.run_attempt }}
          path: reports/node-test-evidence/
          retention-days: 14
          if-no-files-found: ignore

  dashboard:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            package-lock.json
            dashboard/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npm run build
      - run: npm ci --no-audit --no-fund
        working-directory: dashboard
      - run: npm run build
        working-directory: dashboard
      - run: npm test
        working-directory: dashboard
      - run: npx playwright install --with-deps chromium
        working-directory: dashboard
      - run: npm run test:ui
        working-directory: dashboard
      - run: node scripts/ui-check.mjs
      - name: Preserve UI test evidence
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: ui-check-${{ github.sha }}-${{ github.run_attempt }}
          path: reports/ui-check/
          retention-days: 14
          if-no-files-found: ignore

  login-webkit:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      LOGIN_BROWSER: webkit
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            package-lock.json
            dashboard/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npm run build
      - run: npm ci --no-audit --no-fund
        working-directory: dashboard
      - run: npm run build
        working-directory: dashboard
      - run: npx playwright install --with-deps webkit
        working-directory: dashboard
      - run: node --test test-ui/login.test.mjs
        working-directory: dashboard
      - name: Preserve WebKit login screenshots
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: login-webkit-${{ github.sha }}-${{ github.run_attempt }}
          path: reports/ui-check/login/
          retention-days: 14
          if-no-files-found: ignore

  package:
    needs: [core, dashboard, login-webkit, architecture-postgres]
    if: (github.event_name == 'push' && github.ref == 'refs/heads/main') || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Build release images on GitHub
        run: |
          docker build --target api --tag "avila-experiments-api:sha-${GITHUB_SHA}" .
          docker build --target dashboard --tag "avila-experiments-dashboard:sha-${GITHUB_SHA}" .
          mkdir release
          docker save "avila-experiments-api:sha-${GITHUB_SHA}" "avila-experiments-dashboard:sha-${GITHUB_SHA}" | gzip > release/images.tar.gz
          cp compose.yaml release/compose.yaml
          cp deploy/dashboard-applications.compose.yaml release/dashboard-applications.compose.yaml
          cp deploy/dashboard-applications.caddy release/dashboard-applications.caddy
          printf '%s\n' "$GITHUB_SHA" > release/REVISION
          cd release
          sha256sum images.tar.gz compose.yaml dashboard-applications.compose.yaml dashboard-applications.caddy REVISION > SHA256SUMS
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-${{ github.sha }}
          path: release/
          retention-days: 14
          if-no-files-found: error
