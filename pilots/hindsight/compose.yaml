name: avl419-hindsight-pilot
services:
  postgres:
    image: ${POSTGRES_IMAGE:?CI digest required}
    environment:
      POSTGRES_DB: hindsight_pilot
      POSTGRES_USER: hindsight_pilot
      POSTGRES_PASSWORD: ${PILOT_DB_PASSWORD:?Dedicated password required}
    volumes:
      - pilot-postgres:/var/lib/postgresql/data
    networks: [data]
    mem_limit: 1g
    cpus: 1
    pids_limit: 128
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U hindsight_pilot -d hindsight_pilot"]
      interval: 2s
      timeout: 1s
      retries: 10
    restart: "no"
  hindsight:
    image: ${HINDSIGHT_IMAGE:?CI digest required}
    env_file: ${HINDSIGHT_RUNTIME_ENV:?Approved provider configuration file required}
    environment:
      HINDSIGHT_API_DATABASE_URL: postgresql://hindsight_pilot:${PILOT_DB_PASSWORD:?}@postgres:5432/${PILOT_DATABASE_NAME:-hindsight_pilot}
      HINDSIGHT_API_TENANT_EXTENSION: hindsight_api.extensions.builtin.tenant:ApiKeyTenantExtension
      HINDSIGHT_API_TENANT_API_KEY: ${PILOT_API_KEY:?Dedicated service key required}
      HINDSIGHT_API_MCP_ENABLED: "false"
      HINDSIGHT_API_LOG_LEVEL: error
    depends_on:
      postgres:
        condition: service_healthy
    networks: [data, inference]
    mem_limit: 3g
    cpus: 2
    pids_limit: 256
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8888/health', timeout=1)"]
      interval: 2s
      timeout: 2s
      retries: 10
    restart: "no"
  agent:
    image: ${ADAPTER_IMAGE:?CI image required}
    profiles: [agent]
    stdin_open: true
    environment:
      HINDSIGHT_URL: http://hindsight:8888
      HINDSIGHT_API_KEY: ${PILOT_API_KEY:?}
      HINDSIGHT_BANK: ${HINDSIGHT_BANK:?Fixed synthetic bank required}
      PILOT_EXPIRES_AT: ${PILOT_EXPIRES_AT:?Expiration required}
      PILOT_ENABLED: ${PILOT_ENABLED:-false}
    networks: [data]
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    mem_limit: 128m
    cpus: 0.5
    pids_limit: 32
    restart: "no"
networks:
  data:
    internal: true
  inference: {}
volumes:
  pilot-postgres: {}
